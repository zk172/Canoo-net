<td align="left" valign="top"><h1 class="Headline">Position of the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> in the <a href="index.html">Mittelfeld</a></h1></td>

</tr>
<tr>
<td>&nbsp;</td>
</tr>
<tr>
<td align="left" colspan="2">
		
		In <a href="/web/20160724080759/http://www.canoo.net/services/OnlineGrammar/Satz/Wortstellung/Stellungstyp.html">verb-first</a> and <a href="/web/20160724080759/http://www.canoo.net/services/OnlineGrammar/Satz/Wortstellung/Stellungstyp.html">verb-last</a> clauses and sentences, the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> is always in the Mittelfeld. In <a href="/web/20160724080759/http://www.canoo.net/services/OnlineGrammar/Satz/Wortstellung/Stellungstyp.html">verb-second</a> clauses and sentences, it is in the Mittelfeld when the Vorfeld is occupied by another constituent (see <a href="/web/20160724080759/http://www.canoo.net/services/OnlineGrammar/Satz/Wortstellung/Stellungsfeld/Vorfeld.html">Vorfeld</a>)<br>
		<br>In the basic word order of the Mittelfeld the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> tends to come immediately after the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=finite&amp;language=1&amp;service=glossary">finite</a> <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Verb&amp;language=1&amp;service=glossary">verb</a> form (or the word introducing a subordinate clause).<br>
		<br>
		<table border="0" cellpadding="0" cellspacing="2">
			<tr>
				<td class="coltitle">
					<br>  In the Mittelfeld the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> comes first.  <br>
					<br>
				</td>
			</tr>
		</table>
		<br>
		<b>Examples:</b><br>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap><span class="examples">Gestern Abend hat </span></td>
				<td nowrap class="colexpl"><span class="explbold">mein Freund </span></td>
				<td nowrap class="colexpl"><span class="examples">einen DVD-Spieler </span></td>
				<td><span class="examples">gekauft.</span></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=accusative&amp;language=1&amp;service=glossary">accusative</a> obj.</td>
				<td></td>
			</tr>
		</table>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap><span class="examples">Plötzlich musste </span></td>
				<td nowrap class="colexpl"><span class="explbold">ein Autofahrer </span></td>
				<td nowrap class="colexpl"><span class="examples">dem Lastwagen </span></td>
				<td><span class="examples">ausweichen.</span></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</td>
				<td></td>
			</tr>
		</table>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap>...<span class="examples">weil </span></td>
				<td nowrap class="colexpl"><span class="explbold">die Tochter </span></td>
				<td nowrap class="colexpl"><span class="examples">den Eltern </span></td>
				<td nowrap class="colexpl"><span class="examples">das Kind </span></td>
				<td nowrap><span class="examples">verheimlicht hatte.</span></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=accusative&amp;language=1&amp;service=glossary">accusative</a> obj.</td>
				<td></td>
			</tr>
		</table>
		<br>
		<b>Variations:</b><br>
		<br>This subject-first principle is very strong. In some <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Case&amp;language=1&amp;service=glossary">cases</a>, though, other word orders are possible. For example:<br>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap>...<span class="examples">weil </span></td>
				<td nowrap class="colexpl"><span class="examples">es</span></td>
				<td nowrap class="colexpl"><span class="examples">ihnen</span></td>
				<td nowrap class="colexpl"><span class="explbold">die Tochter </span></td>
				<td nowrap><span class="examples">verheimlicht hatte.</span></td>
				<td></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Pronoun&amp;language=1&amp;service=glossary">pronoun</a></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Pronoun&amp;language=1&amp;service=glossary">pronoun</a></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Noun&amp;language=1&amp;service=glossary">noun</a> phrase</td>
				<td></td>
				<td nowrap><font size="-1">See <a href="Pronomen.html">Pronoun before noun</a></font></td>
			</tr>
			<tr>
				<td></td>
				<td><font size="-1"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=accusative&amp;language=1&amp;service=glossary">accusative</a> obj.</font></td>
				<td><font size="-1"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</font></td>
				<td><font size="-1"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a></font></td>
				<td></td>
				<td></td>
			</tr>
		</table>
		<br>
		Also: <span class="examples">...weil die Tochter es ihnen verheimlicht hatte</span>.<br>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap><span class="examples">Damals ist </span></td>
				<td nowrap class="colexpl"><span class="examples">meinem Vater </span></td>
				<td nowrap class="colexpl"><span class="explbold">das schwere Unglück</span></td>
				<td><span class="examples"> passiert.</span></td>
				<td></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle">animate</td>
				<td class="colundertitle">inanimate</td>
				<td></td>
				<td nowrap><font size="-1">See <a href="Belebtheit.html">Animate before inanimate</a>.</font></td>
			</tr>
			<tr>
				<td></td>
				<td><font size="-1"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</font></td>
				<td><font size="-1"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a></font></td>
				<td></td>
				<td></td>
			</tr>
		</table>
		<br>
		<b><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Pronoun&amp;language=1&amp;service=glossary">Pronoun</a> always comes first:</b><br>
		<br>
		When the <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> is a personal <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Pronoun&amp;language=1&amp;service=glossary">pronoun</a> (<i>er, sie, es</i>, etc.) or the indefinite <a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Pronoun&amp;language=1&amp;service=glossary">pronoun</a> <i>man</i>, it always comes first:<br>
		<br>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap>...<span class="examples">weil </span></td>
				<td nowrap class="colexpl"><span class="explbold">sie</span></td>
				<td nowrap class="colexpl"><span class="examples">es </span></td>
				<td nowrap class="colexpl"><span class="examples">ihnen</span></td>
				<td nowrap><span class="examples">verheimlicht hatte.</span></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> </td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=accusative&amp;language=1&amp;service=glossary">accusative</a> obj.</td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</td>
				<td></td>
			</tr>
		</table>
		<br>Not:<span class="examples"> ...weil es ihnen sie verheimlicht hatte.</span><i><br>
			<br>
		</i>
		<table cellpadding="0" cellspacing="2">
			<tr>
				<td nowrap><span class="examples">Damals ist </span></td>
				<td nowrap class="colexpl"><span class="explbold">es</span></td>
				<td nowrap class="colexpl"><span class="examples">meinem Vater </span></td>
				<td><span class="examples"> passiert.</span></td>
			</tr>
			<tr>
				<td></td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=Subject&amp;language=1&amp;service=glossary">subject</a> </td>
				<td class="colundertitle"><a href="/web/20160724080759/http://www.canoo.net/services/Controller?project=1&amp;input=dative&amp;language=1&amp;service=glossary">dative</a> obj.</td>
				<td></td>
			</tr>
		</table>
		<br>Not: <span class="examples">Damals ist meinem Vater es passiert.</span><br>
		<br>
		<hr>
		<br>
		<br>
		<br>
	</td>
</tr>
</table>
